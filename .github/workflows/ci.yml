name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '9'
  # GitHub Actions drops Node 20 for actions on 2026-06-02; opt in now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 1. Secret scanning — cheapest gate, runs first ──────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source=. --exit-code=1

  # ── 2. Dependency audit ─────────────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  # ── 3. Type-check · Lint · Test ─────────────────────────────────────────────
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      # Only build on pushes to main to keep PR feedback fast
      - name: Build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
          NEXT_PUBLIC_APP_URL: https://penpad.io
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

  # ── 4. Run DB migrations before any production deploy ───────────────────────
  #
  # Uses the Supabase Management API (HTTPS) rather than a direct Postgres
  # connection. The direct host (db.*.supabase.co) is IPv6-only; the pooler
  # returns "Tenant not found" for this project. The Management API works from
  # any network and only requires SUPABASE_ACCESS_TOKEN.
  #
  # To generate SUPABASE_ACCESS_TOKEN:
  #   https://supabase.com/dashboard/account/tokens
  # Add it as a GitHub Actions secret named SUPABASE_ACCESS_TOKEN.
  migrate:
    name: DB Migrations
    runs-on: ubuntu-latest
    needs: [secret-scan, audit, quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending migrations via Supabase API
        env:
          PROJECT_REF: vtdmtnpsybqmcgtdvblu
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          API="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"

          # Execute SQL via the Supabase Management API (no direct DB connection needed)
          run_sql() {
            local sql="$1"
            local result
            result=$(curl -sf -X POST "$API" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$sql")")
            echo "$result"
          }

          # Ensure the migration tracking table exists
          run_sql "CREATE SCHEMA IF NOT EXISTS supabase_migrations;
          CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (
            version  text PRIMARY KEY,
            name     text,
            statements text[]
          );" > /dev/null

          # Get already-applied versions
          APPLIED=$(run_sql "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version" \
            | python3 -c "import json,sys; print('\n'.join(r['version'] for r in json.load(sys.stdin)))" 2>/dev/null || echo "")

          # Apply each migration file in version order
          for f in $(ls supabase/migrations/*.sql | sort); do
            VERSION=$(basename "$f" | cut -d'_' -f1)
            NAME=$(basename "$f" .sql | sed "s/^${VERSION}_//")

            if echo "$APPLIED" | grep -qx "$VERSION"; then
              echo "✓  $VERSION ($NAME) — already applied"
            else
              echo "→  Applying $VERSION ($NAME)..."
              SQL=$(cat "$f")
              run_sql "$SQL" > /dev/null
              # Record the migration
              run_sql "INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('${VERSION}', '${NAME}') ON CONFLICT (version) DO NOTHING;" > /dev/null
              echo "✓  $VERSION applied"
            fi
          done

          echo "Migration step complete."

  # ── 5. Deploy to production (main only, after migrations) ───────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [migrate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://penpad.io
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm exec vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - run: pnpm exec vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ── 6. Deploy preview (PRs only) ────────────────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [secret-scan, audit, quality]
    if: github.event_name == 'pull_request'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm exec vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - id: deploy
        run: |
          DEPLOY_URL=$(pnpm exec vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
      - name: Post preview URL comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Preview deployed: ${previewUrl}`
            })
